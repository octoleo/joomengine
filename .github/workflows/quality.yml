name: Quality Gates

on:
  pull_request:
  push:
    branches: [master]
    paths:
      - ".github/workflows/**"
      - "conf/**"
      - "src/**"
      - "tests/**"

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-and-unit:
    name: Static checks and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install test tooling
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y jq shellcheck xmlstarlet gawk

      - name: Validate shell scripts
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' scripts < <(
            find src tests -type f -name '*.sh' -print0 | sort -z
          )
          for script in "${scripts[@]}"; do
            bash -n "$script"
          done
          shellcheck --severity=error "${scripts[@]}"

      - name: Validate JSON and NDJSON
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' json_file; do
            jq -e . "$json_file" >/dev/null
          done < <(
            find conf tests/release-detector/fixtures \
              -type f \
              -name '*.json' \
              -print0 | sort -z
          )
          jq -e . conf/manifest.ndjson >/dev/null

      - name: Run deterministic unit tests
        shell: bash
        run: |
          set -euo pipefail
          ./tests/run.sh

      - name: Lint GitHub Actions workflows
        env:
          ACTIONLINT_VERSION: 1.7.7
          ACTIONLINT_SHA256: 023070a287cd8cccd71515fedc843f1985bf96c436b7effaecce67290e7e0757
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/actionlint.tar.gz"
          curl \
            --fail \
            --silent \
            --show-error \
            --location \
            --retry 3 \
            --output "$archive" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  ${archive}" | sha256sum -c -
          tar --no-same-owner -xzf "$archive" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color

  generate-contexts:
    name: Generate smoke contexts from current templates
    needs: static-and-unit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install generation tooling
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y jq xmlstarlet gawk

      - name: Generate without building or publishing
        shell: bash
        run: |
          set -euo pipefail
          src/bin/joomengine.sh --dry-run --force

      - name: Select standard and MCP contexts
        shell: bash
        run: |
          set -euo pipefail
          destination=quality-contexts
          mkdir -p "$destination/images"
          : > "$destination/manifest.ndjson"

          for flavor in standard mcp; do
            anchor="$(
              jq -scer --arg flavor "$flavor" '
                [.[] | select(.flavor == $flavor and
                  (if $flavor == "mcp" then .latest_mcp else .latest end) == "yes")]
                | if length == 1 then .[0] else error("Missing or ambiguous latest " + $flavor) end
              ' conf/manifest.ndjson
            )"
            for variant in apache fpm fpm-alpine; do
              record="$(
                jq -scer --argjson anchor "$anchor" --arg variant "$variant" '
                  [.[] | select(.version == $anchor.version and .joomla == $anchor.joomla and
                    .php == $anchor.php and .flavor == $anchor.flavor and .variant == $variant)]
                  | if length == 1 then .[0] else error("Missing or ambiguous context") end
                ' conf/manifest.ndjson
              )"
              context="$(jq -er '.context' <<< "$record")"
              test -f "images/$context/Dockerfile"
              test -f "images/$context/docker-entrypoint.sh"
              mkdir -p "$destination/images/$context"
              cp "images/$context/Dockerfile" "images/$context/docker-entrypoint.sh" \
                "$destination/images/$context/"
              printf '%s\n' "$record" >> "$destination/manifest.ndjson"
            done
          done
          jq -se 'length == 6' "$destination/manifest.ndjson" >/dev/null

      - name: Share the exact generated build inputs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: image-smoke-contexts
          path: quality-contexts/
          if-no-files-found: error
          retention-days: 7

  image-smoke:
    name: Image smoke (${{ matrix.flavor }}, ${{ matrix.variant }}, ${{ matrix.platform }})
    needs: generate-contexts
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        flavor: [standard, mcp]
        variant: [apache, fpm, fpm-alpine]
        platform: [linux/amd64]
        architecture: [amd64]
        include:
          - flavor: standard
            variant: apache
            platform: linux/arm64/v8
            architecture: arm64
          - flavor: mcp
            variant: apache
            platform: linux/arm64/v8
            architecture: arm64

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Download generated contexts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: image-smoke-contexts
          path: quality-contexts

      - name: Set up QEMU
        if: matrix.architecture != 'amd64'
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Install context-selection tooling
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y jq

      - name: Select representative image context
        id: context
        env:
          VARIANT: ${{ matrix.variant }}
          FLAVOR: ${{ matrix.flavor }}
          PLATFORM: ${{ matrix.platform }}
        shell: bash
        run: |
          set -euo pipefail
          record="$(
            jq -scer --arg flavor "$FLAVOR" --arg variant "$VARIANT" '
              [.[] | select(.flavor == $flavor and .variant == $variant)]
              | if length == 1 then .[0] else error("Missing or ambiguous smoke context") end
            ' quality-contexts/manifest.ndjson
          )"
          jq -e --arg platform "$PLATFORM" '.base_platforms | has($platform)' <<< "$record" >/dev/null
          context="$(jq -er '.context' <<< "$record")"
          test -f "quality-contexts/images/$context/Dockerfile"
          echo "path=quality-contexts/images/$context" >> "$GITHUB_OUTPUT"
          echo "image=joomengine-smoke:$FLAVOR-$VARIANT-${{ matrix.architecture }}" >> "$GITHUB_OUTPUT"

      - name: Build representative image
        shell: bash
        run: |
          set -euo pipefail
          docker buildx build \
            --load \
            --platform "${{ matrix.platform }}" \
            --pull \
            --tag "${{ steps.context.outputs.image }}" \
            "${{ steps.context.outputs.path }}"

      - name: Validate packaged entrypoint and verified archives
        env:
          FLAVOR: ${{ matrix.flavor }}
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            --platform "${{ matrix.platform }}" \
            --entrypoint bash \
            --env "SMOKE_FLAVOR=$FLAVOR" \
            "${{ steps.context.outputs.image }}" -euc '
              bash -n /entrypoint.sh
              printf "%s  %s\n" "$JCB_SHA512" /usr/src/joomengine/jcb.zip | sha512sum -c -
              if [[ "$SMOKE_FLAVOR" == mcp ]]; then
                test -n "$MCP_VERSION"
                printf "%s  %s\n" "$MCP_SHA512" /usr/src/joomengine/mcp.zip | sha512sum -c -
              else
                test ! -e /usr/src/joomengine/mcp.zip
                test -z "${MCP_VERSION:-}${MCP_SHA512:-}${MCP_PACKAGE:-}"
              fi
            '

      - name: Verify first deployment and restart against MariaDB
        if: matrix.variant == 'apache' && matrix.architecture == 'amd64'
        shell: bash
        run: tests/image-smoke-test.sh "${{ steps.context.outputs.image }}" "${{ matrix.flavor }}"
