name: Quality Gates

on:
  pull_request:
  push:
    branches: [master]
    paths:
      - ".github/workflows/**"
      - "conf/**"
      - "src/**"
      - "tests/**"

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-and-unit:
    name: Static checks and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install test tooling
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y jq shellcheck

      - name: Validate shell scripts
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' scripts < <(
            find src tests -type f -name '*.sh' -print0 | sort -z
          )
          for script in "${scripts[@]}"; do
            bash -n "$script"
          done
          shellcheck --severity=error "${scripts[@]}"

      - name: Validate JSON and NDJSON
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' json_file; do
            jq -e . "$json_file" >/dev/null
          done < <(
            find conf tests/release-detector/fixtures \
              -type f \
              -name '*.json' \
              -print0 | sort -z
          )
          jq -e . conf/manifest.ndjson >/dev/null

      - name: Run deterministic unit tests
        shell: bash
        run: |
          set -euo pipefail
          ./tests/run.sh

      - name: Lint GitHub Actions workflows
        env:
          ACTIONLINT_VERSION: 1.7.7
          ACTIONLINT_SHA256: 023070a287cd8cccd71515fedc843f1985bf96c436b7effaecce67290e7e0757
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/actionlint.tar.gz"
          curl \
            --fail \
            --silent \
            --show-error \
            --location \
            --retry 3 \
            --output "$archive" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  ${archive}" | sha256sum -c -
          tar --no-same-owner -xzf "$archive" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color

  image-smoke:
    name: Image smoke (${{ matrix.variant }}, ${{ matrix.platform }})
    needs: static-and-unit
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: apache
            platform: linux/amd64
            architecture: amd64
          - variant: fpm
            platform: linux/amd64
            architecture: amd64
          - variant: fpm-alpine
            platform: linux/amd64
            architecture: amd64
          - variant: apache
            platform: linux/arm64/v8
            architecture: arm64

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up QEMU
        if: matrix.architecture != 'amd64'
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Install context-selection tooling
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y jq

      - name: Select representative image context
        id: context
        env:
          VARIANT: ${{ matrix.variant }}
        shell: bash
        run: |
          set -euo pipefail
          version="$(jq -r 'select(.latest == "yes") | .version' conf/manifest.ndjson)"
          php_version="$(jq -r 'select(.latest == "yes") | .php' conf/manifest.ndjson)"
          context="$(
            jq -r \
              --arg version "$version" \
              --arg php "$php_version" \
              --arg variant "$VARIANT" \
              'select(
                .version == $version and
                .php == $php and
                .variant == $variant
              ) | .context' \
              conf/manifest.ndjson |
              head -n 1
          )"

          [[ -n "$context" ]] || {
            echo "No representative context found for $VARIANT" >&2
            exit 1
          }
          [[ -f "images/$context/Dockerfile" ]] || {
            echo "Missing generated Dockerfile: images/$context/Dockerfile" >&2
            exit 1
          }

          cp src/docker/docker-entrypoint.sh "images/$context/docker-entrypoint.sh"
          echo "path=images/$context" >> "$GITHUB_OUTPUT"

      - name: Build representative image
        shell: bash
        run: |
          set -euo pipefail
          docker buildx build \
            --load \
            --platform "${{ matrix.platform }}" \
            --pull \
            --tag "joomengine-smoke:${{ matrix.variant }}-${{ matrix.architecture }}" \
            "${{ steps.context.outputs.path }}"

      - name: Validate packaged entrypoint
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            --platform "${{ matrix.platform }}" \
            --entrypoint bash \
            "joomengine-smoke:${{ matrix.variant }}-${{ matrix.architecture }}" \
            -n /entrypoint.sh
