name: Quality Gates

on:
  pull_request:
  push:
    branches: [master]
    paths:
      - ".github/workflows/**"
      - "conf/**"
      - "src/**"
      - "tests/**"

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-and-unit:
    name: Static checks and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install test tooling
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y jq shellcheck xmlstarlet

      - name: Validate shell scripts
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' scripts < <(
            find src tests -type f -name '*.sh' -print0 | sort -z
          )
          for script in "${scripts[@]}"; do
            bash -n "$script"
          done
          shellcheck --severity=error "${scripts[@]}"

      - name: Validate JSON and NDJSON
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' json_file; do
            jq -e . "$json_file" >/dev/null
          done < <(
            find conf tests/release-detector/fixtures \
              -type f -name '*.json' -print0 | sort -z
          )
          jq -e . conf/manifest.ndjson >/dev/null

      - name: Run deterministic unit tests
        shell: bash
        run: ./tests/run.sh

      - name: Lint GitHub Actions workflows
        env:
          ACTIONLINT_VERSION: 1.7.7
          ACTIONLINT_SHA256: 023070a287cd8cccd71515fedc843f1985bf96c436b7effaecce67290e7e0757
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/actionlint.tar.gz"
          curl --fail --silent --show-error --location --retry 3 \
            --output "$archive" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  ${archive}" | sha256sum -c -
          tar --no-same-owner -xzf "$archive" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color

  generate-contexts:
    name: Generate smoke contexts from JSON configuration
    needs: static-and-unit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install generation tooling
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y jq xmlstarlet

      - name: Generate without building or publishing
        shell: bash
        run: src/bin/joomengine.sh --dry-run --force

      - name: Select configured profiles, variants, and available platforms
        id: select
        shell: bash
        run: |
          set -euo pipefail
          destination=quality-contexts
          mkdir -p "$destination/images"
          jq -sc '
            def stable_default:
              .tag_policy == "default" and .joomla_channel == "stable" and
              (.version | test("^[0-9]+\\.[0-9]+\\.[0-9]+$"));
            def release_channel:
              .version | if contains("-") then
                capture("-(?<channel>alpha|beta|rc)").channel else "stable" end;
            def release_key:
              [(.version | split("-")[0] | split(".") | map(tonumber)),
               (.version | split("-")[1] // "" | [scan("[0-9]+") | tonumber] | last // 0),
               (.php | split(".") | map(tonumber))];
            map(. + {target: (.target // .major),
                     tag_policy: (.tag_policy // "default"),
                     joomla_channel: (.joomla_channel // "stable")}) as $all |
            [$all[] | select(stable_default)] as $defaults |
            [$defaults | group_by(.flavor)[] |
              ([.[] | select(.latest == "yes" or .latest_mcp == "yes")] | first) //
              (sort_by(release_key) | last) | select(. != null)
            ] as $anchors |
            [$anchors[] as $anchor | $all[] |
              select(.target == $anchor.target and .version == $anchor.version and
                .joomla == $anchor.joomla and .php == $anchor.php and
                .flavor == $anchor.flavor)] as $current |
            # Retain a normal Apache sample on the highest earlier configured PHP.
            [$anchors[] | select(.flavor == "standard") | . as $anchor |
              [$all[] | select(.target == $anchor.target and .version == $anchor.version and
                .joomla == $anchor.joomla and .profile == "standard" and
                .flavor == "standard" and .variant == "apache" and
                ((.php | split(".") | map(tonumber)) <
                 ($anchor.php | split(".") | map(tonumber))))] |
              sort_by(.php | split(".") | map(tonumber)) | last | select(. != null)
            ] as $previous_php |
            # Exercise qualified and preview-only targets separately from stable defaults.
            [$all[] | .target as $target |
              select(.tag_policy == "qualified" or
                ([$defaults[] | select(.target == $target)] | length) == 0)] |
            group_by([.target, .flavor, release_channel]) |
            [.[] as $group | ($group | max_by(release_key)) as $anchor |
              $group[] | select(.version == $anchor.version and .php == $anchor.php)
            ] as $additional |
            # Also exercise the oldest active stable series with a normal Apache base.
            [$defaults[] | select(.flavor == "standard" and .profile == "standard" and
              .variant == "apache")] | sort_by(.joomla | split(".") | map(tonumber)) |
            (if length == 0 then [] else
              .[0].target as $oldest |
              [.[] | select(.target == $oldest)] | sort_by(release_key) | [last]
            end) as $historical |
            ($current + $previous_php + $additional + $historical) | unique_by(.context) |
            if length > 0 then . else error("No configured smoke contexts") end
          ' conf/manifest.ndjson > "$destination/selected.json"

          while IFS= read -r context; do
            test -f "images/$context/Dockerfile"
            test ! -e "images/$context/docker-entrypoint.sh"
            if grep -Eq '^(ENTRYPOINT|CMD|COPY)[[:space:]]' "images/$context/Dockerfile"; then
              echo "Generated images must inherit Joomla startup without runtime scripts." >&2
              exit 1
            fi
            mkdir -p "$destination/images/$context"
            cp "images/$context/Dockerfile" "$destination/images/$context/"
          done < <(jq -r '.[].context' "$destination/selected.json")

          matrix="$(jq -c '
            . as $selected |
            {include: [
              .[] as $record |
              (if $record.base_platforms["linux/amd64"] != null then
                 {platform: "linux/amd64", architecture: "amd64"} else empty end,
               if $record.variant == "apache" and
                  $record.base_platforms["linux/arm64/v8"] != null then
                 {platform: "linux/arm64/v8", architecture: "arm64"} else empty end) as $host |
              ([$selected[] | select(.profile == "standard" and .target == $record.target and
                 .version == $record.version and .joomla == $record.joomla and
                 .php == $record.php and .variant == $record.variant and
                 .flavor == $record.flavor and
                 .base_platforms[$host.platform] != null)][0].context // "") as $normal |
              {target: $record.target, profile: $record.profile, flavor: $record.flavor,
               variant: $record.variant, version: $record.version, php: $record.php,
               context: $record.context, platform: $host.platform,
               architecture: $host.architecture, normal_context: $normal,
               image: "joomengine-smoke:candidate",
               normal_image: "joomengine-smoke:normal"}
            ]} | if (.include | length) > 0 then . else error("No smoke platforms available") end
          ' "$destination/selected.json")"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

      - name: Share the exact generated build inputs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: image-smoke-contexts
          path: quality-contexts/
          if-no-files-found: error
          retention-days: 7

  image-smoke:
    name: Image smoke (${{ matrix.target }}, JCB ${{ matrix.version }}, PHP ${{ matrix.php }}, ${{ matrix.profile }}, ${{ matrix.flavor }}, ${{ matrix.variant }}, ${{ matrix.architecture }})
    needs: generate-contexts
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.generate-contexts.outputs.matrix) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Download generated contexts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: image-smoke-contexts
          path: quality-contexts

      - name: Set up QEMU
        if: matrix.architecture != 'amd64'
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Build representative image
        env:
          CONTEXT: ${{ matrix.context }}
          IMAGE: ${{ matrix.image }}
          PLATFORM: ${{ matrix.platform }}
        shell: bash
        run: |
          set -euo pipefail
          docker buildx build --load --platform "$PLATFORM" --pull \
            --tag "$IMAGE" "quality-contexts/images/$CONTEXT"

      - name: Build normal counterpart for volume-switch test
        if: matrix.profile == 'dev' && matrix.variant == 'apache' && matrix.architecture == 'amd64' && matrix.normal_context != ''
        env:
          CONTEXT: ${{ matrix.normal_context }}
          IMAGE: ${{ matrix.normal_image }}
        shell: bash
        run: |
          set -euo pipefail
          docker buildx build --load --platform linux/amd64 --pull \
            --tag "$IMAGE" "quality-contexts/images/$CONTEXT"

      - name: Validate inherited startup, verified packages, and profile tools
        env:
          FLAVOR: ${{ matrix.flavor }}
          PROFILE: ${{ matrix.profile }}
          VARIANT: ${{ matrix.variant }}
          IMAGE: ${{ matrix.image }}
          PLATFORM: ${{ matrix.platform }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(docker image inspect --format '{{json .Config.Entrypoint}}' "$IMAGE")" = '["/entrypoint.sh"]'
          expected_command='["php-fpm"]'
          [[ "$VARIANT" != apache ]] || expected_command='["apache2-foreground"]'
          test "$(docker image inspect --format '{{json .Config.Cmd}}' "$IMAGE")" = "$expected_command"
          docker run --rm --platform "$PLATFORM" --entrypoint bash \
            --env "SMOKE_FLAVOR=$FLAVOR" --env "SMOKE_PROFILE=$PROFILE" \
            "$IMAGE" -euc '
              bash -n /entrypoint.sh
              if [[ "$SMOKE_PROFILE" == dev ]]; then
                php --ri xdebug >/dev/null
                php --ri pcntl >/dev/null
                php --ri sockets >/dev/null
                composer --version
                node --version
                npm --version
                npx --version
                for tool in git ssh patch zip unzip rsync jq python3 make g++; do
                  command -v "$tool" >/dev/null
                done
              else
                php -r "exit(extension_loaded(\"xdebug\") ? 1 : 0);"
              fi
              printf "%s  %s\n" "$JCB_SHA512" "$JCB_INSTALL_DIR/jcb.zip" | sha512sum -c -
              if [[ "$SMOKE_FLAVOR" == mcp ]]; then
                test -n "$MCP_VERSION"
                printf "%s  %s\n" "$MCP_SHA512" "$JCB_INSTALL_DIR/mcp.zip" | sha512sum -c -
              else
                test ! -e "$JCB_INSTALL_DIR/mcp.zip"
                test -z "${MCP_VERSION:-}${MCP_SHA512:-}${MCP_PACKAGE:-}"
              fi
            '

      - name: Verify first deployment, restart, and available profile switch
        if: matrix.variant == 'apache' && matrix.architecture == 'amd64'
        env:
          IMAGE: ${{ matrix.image }}
          FLAVOR: ${{ matrix.flavor }}
          PROFILE: ${{ matrix.profile }}
          NORMAL_CONTEXT: ${{ matrix.normal_context }}
          NORMAL_IMAGE: ${{ matrix.normal_image }}
        shell: bash
        run: |
          args=("$IMAGE" "$FLAVOR" "$PROFILE")
          if [[ "$PROFILE" == dev && -n "$NORMAL_CONTEXT" ]]; then
            args+=("$NORMAL_IMAGE")
          fi
          tests/image-smoke-test.sh "${args[@]}"
